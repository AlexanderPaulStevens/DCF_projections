[project]
name = "dcf-projections"
version = "0.1.0"
description = "S&P 500 Financial Data Scraper for DCF Projections"
authors = [
    {name = "Alexander Stevens", email = "alexanderstevens97@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "matplotlib>=3.5.0",
    "tabulate>=0.9.0",
    "prophet>=1.1.0",
    # Scraping dependencies
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    # API dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "asgiref>=3.7.0",
    # Cloud dependencies
    "google-cloud-storage>=2.10.0",
    "litserve==0.2.0",
    "pydantic-settings>=2.11.0",
    "scikit-learn>=1.7.2",
    "statsmodels>=0.14.5",
    "darts>=0.38.0",
    "neuralprophet>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]


[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
