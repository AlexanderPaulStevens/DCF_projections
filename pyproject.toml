[project]
name = "dcf-projections"
version = "0.1.0"
description = "S&P 500 Financial Data Scraper for DCF Projections"
authors = [
    {name = "Alexander Stevens", email = "alexanderstevens97@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas<2.0.0,>=1.5.0",
    "numpy<2.0.0,>=1.24.0",
    "lxml>=4.9.0",
    "yfinance>=0.2.0",
    "matplotlib>=3.5.0",
    "tabulate>=0.9.0",
    "streamlit>=1.48.1",
    "plotly>=6.3.0",
    "pre-commit>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
